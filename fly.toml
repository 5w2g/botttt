app = 'iqgx-bot'
primary_region = 'cdg'

[build]
  builder = 'dockerfile'

[env]
  PYTHONUNBUFFERED = '1'

[processes]
  app = 'python bot.py'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
